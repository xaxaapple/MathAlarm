name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # нужно только для публикации релиза по тегу v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle wrapper в репозитории не нужен: нужная версия Gradle ставится прямо здесь
      # (AGP 8.13.2 требует Gradle 8.13 или новее).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MathAlarm.apk
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MathAlarm-apk
          path: dist/MathAlarm.apk
          if-no-files-found: error

      - name: Publish GitHub Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/MathAlarm.apk \
            --title "MathAlarm ${{ github.ref_name }}" \
            --generate-notes
